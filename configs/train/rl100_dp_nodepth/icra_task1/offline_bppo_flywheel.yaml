# RL-100 offline BPPO for the LeTools RGB-only Diffusion Policy on ICRA Task 1.
# Replace every /path/to/... value before running.

paths:
  allowed_root: /path/to/workspace
  repo_root: /path/to/LeTools-Learning
  dataset_root: /path/to/lerobot_dataset
  terminal_annotations: /path/to/icra_task1_release_terminal.csv
  bc_checkpoint: /path/to/dp_nodepth_checkpoint/pretrained_model
  output_root: /path/to/outputs/rl100_bppo_dp_nodepth
  log_root: /path/to/logs/rl100_bppo_dp_nodepth
  tmp_root: /path/to/tmp/rl100_bppo_dp_nodepth

task:
  name: icra_task1
  state_dim: 16
  action_dim: 16
  left_gripper_index: 7
  right_gripper_index: 15
  stable_open_frames: 3
  excluded_episode_indices: []

data:
  expected_episode_count: 50
  dataset_repo_id: lerobot/your_dataset
  video_backend: pyav
  validation_fraction: 0.10

runtime:
  device: cuda:0
  enforce_gpu_idle: true
  min_free_gpu_gib: 35
  max_gpu_utilization_percent: 100

training:
  run_tag: icra_task1_dp_nodepth_flywheel_bppo
  seed: 1000
  gamma: 0.99
  batch_size: 32
  num_workers: 2
  max_batches_per_epoch: 100
  log_every_batches: 1

critic:
  epochs: 150
  hidden_dim: 512
  depth: 3
  q_lr: 0.0001
  v_lr: 0.0001
  expectile: 0.7
  tau: 0.005
  target_update_freq: 2

dynamics:
  epochs: 350
  patience: 50
  relative_improvement_threshold: 0.01
  lr: 0.0003
  reward_loss_weight: 1.0
  positive_reward_weight: 3.0
  rollout_mode: elite_mean
  terminal_mode: learned
  terminal_classifier_threshold: 0.5
  auto_calibrate_terminal_threshold: false
  hidden_dims: [512, 512, 512]
  weight_decays: [0.000025, 0.00005, 0.000075, 0.0001]
  ensemble_size: 5
  num_elites: 3

bppo:
  steps: 8000
  save_every: 1000
  num_inference_steps: 10
  lr: 0.0000001
  clip_ratio: 0.2
  chunk_ratio_mode: scalar
  advantage_mode: chunk_vdelta_scalar
  advantage_clip: 5.0
  enable_ratio_logging: true
  ratio_log_every_updates: 1
  stability_guard:
    enabled: true
    warmup_steps: 50
    ratio_q95_max: 5.0
    ratio_mean_min: 0.5
    ratio_mean_max: 1.5
    consecutive_violations: 3
